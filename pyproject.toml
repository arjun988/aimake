[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimake"
version = "2.0.0"
description = "An incremental build system for AI applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "aimake contributors" }]
keywords = ["ai", "ml", "build", "incremental", "pipeline", "rag", "llm", "agent", "makefile", "prompt", "dataset", "huggingface", "MLFlow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
s3 = [
    "boto3>=1.34",
]
huggingface = [
    "huggingface_hub>=0.23",
]
wandb = [
    "wandb>=0.16",
]
dvc = [
    "dvc>=3.0",
]
docker = []
ollama = []
plugins = [
    "wandb>=0.16",
    "dvc>=3.0",
    "huggingface_hub>=0.23",
]
all = [
    "boto3>=1.34",
    "optuna>=3.5",
    "mlflow>=2.9",
    "huggingface_hub>=0.23",
    "wandb>=0.16",
    "dvc>=3.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
optuna = [
    "optuna>=3.5",
]
mlflow = [
    "mlflow>=2.9",
]
experiments = [
    "optuna>=3.5",
    "mlflow>=2.9",
]

[project.scripts]
aimake = "aimake.cli:app"

[project.urls]
Homepage = "https://github.com/arjun988/aimake"
Documentation = "https://github.com/arjun988/aimake#readme"
Repository = "https://github.com/arjun988/aimake"
Issues = "https://github.com/arjun988/aimake/issues"

[tool.hatch.build.targets.wheel]
packages = ["aimake"]

# Sdist must NOT ship Next.js apps or node_modules (hundreds of MB).
# Wheel already only contains the Python package.
[tool.hatch.build.targets.sdist]
only-include = [
  "aimake",
  "tests",
  "examples",
  "docs",
  "sdk",
  ".github",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "Dockerfile",
  ".dockerignore",
  "IMPROVE.md",
  "pyproject.toml",
]
exclude = [
  "**/node_modules",
  "**/.next",
  "**/.aimake",
  "**/__pycache__",
  "**/*.pyc",
  "examples/**/build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["aimake"]
