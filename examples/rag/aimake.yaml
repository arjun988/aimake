project:
  name: rag-example
  version: "1.0"

artifacts:

  dataset:
    type: dataset
    source: data/train.jsonl

  preprocess:
    type: dataset
    depends_on:
      - dataset
    command: python src/preprocess.py
    outputs:
      - build/processed/

  embeddings:
    type: embedding
    depends_on:
      - preprocess
    command: python src/embed.py
    outputs:
      - build/embeddings/

  index:
    type: vector_index
    depends_on:
      - embeddings
    command: python src/build_index.py
    outputs:
      - build/index/

  prompt:
    type: prompt
    source: prompts/system.txt

  evaluation:
    type: evaluation
    depends_on:
      - index
      - prompt
    command: python src/evaluate.py
    outputs:
      - build/evaluation/
    parameters:
      temperature: 1.0
    metrics:
      file: build/evaluation/results.json

  report:
    type: report
    depends_on:
      - evaluation
    command: python src/report.py
    outputs:
      - build/report/

quality_gates:
  accuracy:
    minimum: 0.80
  latency_ms:
    maximum: 1000
  cost_usd:
    maximum: 1.00

# Optional: automatic hyperparameter optimization
optimization:
  trials: 3
  strategy: grid
  parameter_artifact: evaluation
  search_space:
    temperature:
      type: float
      low: 0.8
      high: 1.2
      step: 0.2
  objective:
    metric: accuracy
    direction: maximize
    artifact: evaluation

