name: AI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  aimake:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install aimake
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Test example RAG project
        working-directory: examples/rag
        run: |
          aimake build
          aimake build
          aimake plan
          aimake status
