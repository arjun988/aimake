name: AI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  aimake:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install aimake with all extras
        run: pip install -e ".[all]"

      - name: Run full test suite
        run: pytest tests/ -v --tb=short

      - name: Test example RAG incremental build
        working-directory: examples/rag
        run: |
          aimake build
          aimake build
          # Plan prints SKIP (not "cached") for unchanged artifacts
          aimake plan --format json > /tmp/aimake-plan.json
          python -c "import json; p=json.load(open('/tmp/aimake-plan.json')); assert len(p.get('to_skip') or []) >= 5, p; assert not (p.get('to_run') or []), p"
          echo "modified prompt" >> prompts/system.txt
          aimake plan
          aimake diff prompt --baseline stored || true
          aimake status

      - name: Test new CLI commands
        working-directory: examples/rag
        run: |
          aimake workers
          aimake cache status
          aimake doctor
          aimake compare || true
          aimake optimize --dry-run || true
          aimake experiments list

      - name: Verify cache config schema
        run: python -c "from aimake.config.schema import RemoteCacheConfig, S3CacheConfig; RemoteCacheConfig(type='s3', s3=S3CacheConfig(bucket='b'))"
