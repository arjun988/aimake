# Example: use the official aimake GitHub Action in your repo
name: aimake CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arjun988/aimake/.github/actions/aimake@v1
        with:
          config: examples/rag/aimake.yaml
          extra: all
          post-comment: "true"

      # Or run locally in the same job:
