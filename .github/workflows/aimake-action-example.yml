# Example: use the official aimake GitHub Action in your repo
name: aimake CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same-repo: use the local composite action (no release tag required).
      # In other repos after tagging a release:
      #   uses: arjun988/aimake/.github/actions/aimake@v2
      - uses: ./.github/actions/aimake
        with:
          config: examples/rag/aimake.yaml
          cache-path: examples/rag/.aimake
          extra: all
          post-comment: "true"

      # Or run locally in the same job:
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      # - run: pip install aimake
      # - run: aimake build
      #   working-directory: examples/rag
